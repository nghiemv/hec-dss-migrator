name: Bug report
description: Report a problem with hec-dss-migrator
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Library version
      description: From the published jar name or your dependency declaration.
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS (Intel)
        - macOS (Apple Silicon via Rosetta)
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: jdk
    attributes:
      label: JDK version
      placeholder: Temurin 17.0.9
    validations:
      required: true

  - type: input
    id: host-heclib
    attributes:
      label: Host application's javaHeclib version (if any)
      description: If the host JVM already loads a javaHeclib, which version?
      placeholder: 7-IU-16 / none

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, what did you observe?
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: |
        A minimal code snippet and (if relevant) a description of the DSS file
        structure. Don't attach files containing sensitive data.

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: shell
