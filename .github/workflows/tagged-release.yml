name: Release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            classifier: linux-x86_64
          - os: windows-latest
            classifier: windows-x86_64
          - os: macos-13
            classifier: macOS-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Build jar
        run: ./gradlew jar -PversionOverride=${{ github.ref_name }}

      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: jar-${{ matrix.classifier }}
          path: build/libs/hec-dss-migrator-*.jar
          if-no-files-found: error

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all jars
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          merge-multiple: true
          path: release-artifacts/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "hec-dss-migrator ${{ github.ref_name }}" \
            --notes "See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for usage." \
            release-artifacts/*.jar
