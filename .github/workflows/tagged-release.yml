name: Release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write

jobs:
  # Smoke-build the jar on Linux + Windows so a release tag fails fast if a
  # cross-platform regression slipped in. These artifacts are not published.
  validate:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew jar -PversionOverride=${{ github.ref_name }}

  # Build the publishable artifact set on macOS so the bundled macOS dylibs
  # are ad-hoc resigned (processResources's doLast only runs on a mac host)
  # — that's the variant we ship.
  release:
    needs: validate
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64

      - uses: gradle/actions/setup-gradle@v4

      - name: Build jar, sources, and javadoc
        run: ./gradlew jar sourcesJar javadocJar -PversionOverride=${{ github.ref_name }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "hec-dss-migrator ${{ github.ref_name }}" \
            --notes "See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for usage." \
            build/libs/hec-dss-migrator-${{ github.ref_name }}.jar \
            build/libs/hec-dss-migrator-${{ github.ref_name }}-sources.jar \
            build/libs/hec-dss-migrator-${{ github.ref_name }}-javadoc.jar
