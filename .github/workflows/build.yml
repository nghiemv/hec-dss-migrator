name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  checks: write
  pull-requests: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / JDK ${{ matrix.jdk }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:      [ubuntu-latest, windows-latest, macos-latest]
        jdk:     ['11', '17', '21']
        profile: [standard, edge]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          architecture: x64

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        if: matrix.profile == 'standard'
        run: ./gradlew build --no-daemon

      - name: Build (edge — locale/encoding/forced staging)
        if: matrix.profile == 'edge'
        run: ./gradlew build -PstrictEnv=true --no-daemon

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          annotate_only: true
          include_passed: true
          report_paths: '**/build/test-results/test/TEST-*.xml'

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-jdk${{ matrix.jdk }}-${{ matrix.profile }}
          path: build/reports/tests/
          if-no-files-found: ignore
