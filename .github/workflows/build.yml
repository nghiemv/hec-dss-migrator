name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / JDK ${{ matrix.jdk }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:      [ubuntu-latest, windows-latest, macos-13]
        jdk:     ['11', '17', '21']
        profile: [standard, edge]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - uses: gradle/actions/setup-gradle@v3
        with:
          dependency-graph: generate-and-submit

      - name: Build
        if: matrix.profile == 'standard'
        run: ./gradlew build --no-daemon

      - name: Build (edge — locale/encoding/forced staging)
        if: matrix.profile == 'edge'
        run: ./gradlew build -PstrictEnv=true --no-daemon

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          annotate_only: true
          include_passed: true
          report_paths: '**/build/test-results/test/TEST-*.xml'

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-jdk${{ matrix.jdk }}-${{ matrix.profile }}
          path: build/reports/tests/
          if-no-files-found: ignore

  # Smoke-compile on an unsupported platform so failures surface as a clear
  # message rather than a JNI UnsatisfiedLinkError.
  unsupported-platform:
    name: Compile-only (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew compileJava compileTestJava --no-daemon
